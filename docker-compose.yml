x-database-environment: &database-environment
  ConnectionStrings__UnifiedDideConnection: >-
    Server=${DB_HOST:?Set DB_HOST},${DB_PORT:-1433};
    Database=${UNIFIED_DB_NAME:-tesis_unified};
    User Id=${DB_USER:?Set DB_USER};
    Password=${DB_PASS:?Set DB_PASS};
    TrustServerCertificate=True;

  # AppDbContext se conserva únicamente por la dependencia actual de DW/ETL.
  # migrate-unified NO toca esta base.
  ConnectionStrings__DefaultConnection: >-
    Server=${DB_HOST:?Set DB_HOST},${DB_PORT:-1433};
    Database=${DB_NAME:?Set DB_NAME};
    User Id=${DB_USER:?Set DB_USER};
    Password=${DB_PASS:?Set DB_PASS};
    TrustServerCertificate=True;


services:

  # ============================================================
  # MIGRATIONS UNIFIED
  # ============================================================
  migrate-unified:
    build: &backend-build
      context: .
      dockerfile: ./tesisproject.backend/Dockerfile

    environment:
      <<: *database-environment
      ASPNETCORE_ENVIRONMENT: Production

    command:
      - "--migrate-unified"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: "no"


  # ============================================================
  # BACKEND API
  # ============================================================
  api:
    build: *backend-build

    depends_on:
      migrate-unified:
        condition: service_completed_successfully

    environment:
      <<: *database-environment
      # Production Development Environment. Cambiar a Development para debug.
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      # El job migrate-unified ya se encarga del contexto Unified.
      # No ejecutar automáticamente migrations legacy/DW.
      DatabaseBootstrap__ApplyMigrations: "false"

      ArticlesModule__Enabled: "true"

      ExternalApis__BaseUrl: ${EXTERNAL_APIS_BASE_URL:-http://host.docker.internal:3000}

      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Jwt__Issuer: ${JWT_ISSUER:-tesisproject-local}
      Jwt__Audience: ${JWT_AUDIENCE:-tesisproject-local}

      Cors__AllowedOrigins__0: http://localhost:${WEB_HOST_PORT:-8090}
      Cors__AllowedOrigins__1: http://localhost:${API_HOST_PORT:-8091}

      BootstrapSuperadmin__Enabled: ${BOOTSTRAP_SUPERADMIN_ENABLED:-false}
      BootstrapSuperadmin__AspUserId: ${BOOTSTRAP_SUPERADMIN_ASP_USER_ID:-}
      BootstrapSuperadmin__Email: ${BOOTSTRAP_SUPERADMIN_EMAIL:-}
      BootstrapSuperadmin__Username: ${BOOTSTRAP_SUPERADMIN_USERNAME:-}
      BootstrapSuperadmin__Password: ${BOOTSTRAP_SUPERADMIN_PASSWORD:-}

      Storage__RootPath: /app/files

    volumes:
      - type: bind
        source: ${STORAGE_HOST_PATH:?Set STORAGE_HOST_PATH}
        target: /app/files

    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Útil para desarrollo/debug.
    # Nginx seguirá consumiendo api:8080 internamente.
    ports:
      - "${API_HOST_PORT:-8091}:8080"

    restart: unless-stopped


  # ============================================================
  # FRONTEND / NGINX
  # ============================================================
  web:
    build:
      context: .
      dockerfile: ./tesisproject.frontend/Dockerfile

    depends_on:
      - api

    ports:
      - "${WEB_HOST_PORT:-8090}:80"

    restart: unless-stopped
