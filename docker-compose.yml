x-database-environment: &database-environment
  ConnectionStrings__UnifiedDideConnection: >-
    Server=${DB_HOST:?Set DB_HOST},${DB_PORT:-1433};
    Database=${DB_NAME:-tesis_unified};
    User Id=${DB_USER:?Set DB_USER};
    Password=${DB_PASS:?Set DB_PASS};
    TrustServerCertificate=True;

  ConnectionStrings__ProjectsDwConnection: >-
    Server=${DB_HOST:?Set DB_HOST},${DB_PORT:-1433};
    Database=${DB_NAME:-tesis_unified};
    User Id=${DB_USER:?Set DB_USER};
    Password=${DB_PASS:?Set DB_PASS};
    TrustServerCertificate=True;

  ConnectionStrings__ArticlesDwConnection: >-
    Server=${DB_HOST:?Set DB_HOST},${DB_PORT:-1433};
    Database=${DB_NAME:-tesis_unified};
    User Id=${DB_USER:?Set DB_USER};
    Password=${DB_PASS:?Set DB_PASS};
    TrustServerCertificate=True;


services:

  # ============================================================
  # DATABASE MIGRATIONS
  # ============================================================
  migrate-database:
    build: &backend-build
      context: .
      dockerfile: ./tesisproject.backend/Dockerfile

    environment:
      <<: *database-environment
      ASPNETCORE_ENVIRONMENT: Production

    command:
      - "--migrate-database"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: "no"


  # ============================================================
  # BACKEND API
  # ============================================================
  api:
    build: *backend-build

    depends_on:
      migrate-database:
        condition: service_completed_successfully

    environment:
      <<: *database-environment
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080

      ArticlesModule__Enabled: "true"

      ExternalApis__BaseUrl: ${EXTERNAL_APIS_BASE_URL:-http://host.docker.internal:3000}
      ExternalApis__Scopus__ApiKey: ${SCOPUS_API_KEY:-}
      ExternalApis__Scopus__InstToken: ${SCOPUS_INST_TOKEN:-}

      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Jwt__Issuer: ${JWT_ISSUER:-tesisproject-local}
      Jwt__Audience: ${JWT_AUDIENCE:-tesisproject-local}

      Cors__AllowedOrigins__0: http://localhost:${WEB_HOST_PORT:-8090}
      Cors__AllowedOrigins__1: http://localhost:${API_HOST_PORT:-8091}

      BootstrapSuperadmin__Enabled: ${BOOTSTRAP_SUPERADMIN_ENABLED:-false}
      BootstrapSuperadmin__AspUserId: ${BOOTSTRAP_SUPERADMIN_ASP_USER_ID:-}
      BootstrapSuperadmin__Email: ${BOOTSTRAP_SUPERADMIN_EMAIL:-}
      BootstrapSuperadmin__Username: ${BOOTSTRAP_SUPERADMIN_USERNAME:-}
      BootstrapSuperadmin__Password: ${BOOTSTRAP_SUPERADMIN_PASSWORD:-}

      AdministrativeOperations__Enabled: ${ADMINISTRATIVE_OPERATIONS_ENABLED:-false}
      AdministrativeOperations__Secret: ${ADMINISTRATIVE_OPERATIONS_SECRET:-}

      Storage__RootPath: /app/files

    volumes:
      - type: bind
        source: ${STORAGE_HOST_PATH:-./.docker-data/files}
        target: /app/files
        bind:
          create_host_path: true

    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Acceso directo solo desde el host; Nginx consume api:8080 internamente.
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8091}:8080"

    restart: unless-stopped


  # ============================================================
  # FRONTEND / NGINX
  # ============================================================
  web:
    build:
      context: .
      dockerfile: ./tesisproject.frontend/Dockerfile

    depends_on:
      - api

    ports:
      - "${WEB_HOST_PORT:-8090}:80"

    restart: unless-stopped
